<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="AniComplex - Eng zamonaviy anime portali. 1000+ anime, admin panel, chat, yuklab olish va boshqalar.">
    <meta name="keywords" content="anime, animatsiya, manga, admin panel, yuklab olish, live chat">
    <meta name="author" content="AniComplex Team">
    <title>AniComplex | Zamonaviy Anime Portali</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    
    <style>
        /* Qo'shimcha inline styles - 500+ qator */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background: #0a0a0a;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }
        
        /* Dinamik mouse tracking light */
        .mouse-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(238, 9, 121, 0.15) 0%, rgba(238, 9, 121, 0.08) 30%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            filter: blur(8px);
            mix-blend-mode: screen;
        }
        
        /* Background parallax layers */
        .bg-layer-1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.pinimg.com/originals/6e/f5/4b/6ef54b9bcb54d4c944746b153b5ecb33.gif') center/cover no-repeat;
            filter: brightness(0.25) blur(6px);
            z-index: -3;
            animation: slowZoom 20s infinite alternate;
        }
        
        .bg-layer-2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(125deg, rgba(10,10,20,0.7), rgba(20,5,40,0.85));
            z-index: -2;
        }
        
        .bg-layer-3 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, transparent, transparent 100px, rgba(238,9,121,0.02) 100px, rgba(238,9,121,0.05) 200px);
            z-index: -1;
            pointer-events: none;
        }
        
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        
        /* Main scroll container with custom scrollbar */
        .main-scroll-container {
            height: 65vh;
            overflow-y: auto;
            margin: 1.5rem 2rem;
            padding: 1.5rem;
            background: rgba(5, 5, 15, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: all 0.4s;
            scroll-behavior: smooth;
        }
        
        .main-scroll-container:hover {
            border-color: rgba(238, 9, 121, 0.3);
            box-shadow: 0 10px 50px rgba(238,9,121,0.2);
        }
        
        /* Custom scrollbar styling */
        .main-scroll-container::-webkit-scrollbar {
            width: 10px;
        }
        
        .main-scroll-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .main-scroll-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6a00, #ee0979);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .main-scroll-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ee0979, #ff6a00);
            transform: scaleX(1.2);
        }
        
        /* Anime Cards Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            padding: 0.5rem;
        }
        
        /* Floating Navigation */
        .glass-nav {
            background: rgba(15, 15, 30, 0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.6s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
        }
        
        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            padding: 0.5rem 0;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-links a:hover {
            color: #ff6a00;
            transform: translateY(-2px);
        }
        
        /* Admin Panel Section */
        .admin-section {
            margin: 2rem;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 2rem;
            border: 1px solid rgba(238, 9, 121, 0.4);
            transition: all 0.4s;
        }
        
        .admin-section:hover {
            border-color: rgba(238, 9, 121, 0.8);
            box-shadow: 0 0 30px rgba(238, 9, 121, 0.3);
        }
        
        .admin-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        
        .admin-title i {
            color: #ee0979;
            animation: rotate 4s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 500px;
            margin-bottom: 2rem;
        }
        
        .admin-input {
            padding: 12px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .admin-input:focus {
            outline: none;
            border-color: #ee0979;
            box-shadow: 0 0 15px rgba(238,9,121,0.3);
            background: rgba(255,255,255,0.12);
        }
        
        .btn {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(238,9,121,0.5);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(238,9,121,0.5);
        }
        
        /* Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 360px;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(238,9,121,0.4);
            z-index: 1001;
            transition: all 0.4s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        
        .chat-header {
            padding: 12px 18px;
            background: linear-gradient(135deg, rgba(238,9,121,0.2), rgba(255,106,0,0.1));
            border-radius: 20px 20px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        
        .chat-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        
        .chat-widget.open .chat-body {
            max-height: 400px;
        }
        
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-message {
            background: rgba(238,9,121,0.15);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            animation: fadeInUp 0.3s;
        }
        
        .system-message {
            background: rgba(255,106,0,0.2);
            border-left: 3px solid #ff6a00;
        }
        
        .chat-input-area {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .chat-input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            color: white;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Quiz teaser */
        .quiz-teaser {
            margin: 1rem 2rem;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(238,9,121,0.2), rgba(255,106,0,0.1));
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .quiz-teaser:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, rgba(238,9,121,0.3), rgba(255,106,0,0.2));
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .glass-nav {
                padding: 0.8rem 1rem;
            }
            
            .main-scroll-container {
                margin: 1rem;
                padding: 1rem;
                height: 55vh;
            }
            
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
            
            .admin-section {
                margin: 1rem;
                padding: 1rem;
            }
            
            .chat-widget {
                width: 300px;
                right: 15px;
                bottom: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .anime-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Loading animation */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        
        .loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(238,9,121,0.3);
            border-top-color: #ee0979;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- Loader -->
<div class="loader" id="loader">
    <div class="spinner"></div>
</div>

<!-- Mouse glow effect -->
<div class="mouse-glow" id="mouseGlow"></div>

<!-- Background layers -->
<div class="bg-layer-1"></div>
<div class="bg-layer-2"></div>
<div class="bg-layer-3"></div>

<!-- Navigation -->
<nav class="glass-nav">
    <div class="logo">
        <i class="fas fa-dragon"></i> AniComplex
    </div>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> Bosh sahifa</a>
        <a href="pages/anime-list.html"><i class="fas fa-list"></i> Animelar</a>
        <a href="pages/admin.html"><i class="fas fa-user-cog"></i> Admin Panel</a>
        <a href="pages/quiz.html"><i class="fas fa-question-circle"></i> Quiz</a>
        <a href="pages/download.html"><i class="fas fa-download"></i> Ilova</a>
    </div>
</nav>

<!-- Main scroll container -->
<div class="main-scroll-container" id="mainScroll">
    <div class="anime-grid" id="animeGrid">
        <!-- Anime cards will be loaded here dynamically -->
    </div>
</div>

<!-- Admin Panel Section -->
<div class="admin-section" id="adminSection">
    <div class="admin-title">
        <i class="fas fa-shield-alt"></i>
        <span>ADMIN PANEL - Anime boshqaruvi</span>
    </div>
    <div class="admin-form-group">
        <input type="text" id="animeName" class="admin-input" placeholder="Anime nomi (masalan: Attack on Titan)">
        <input type="text" id="animeImage" class="admin-input" placeholder="Rasm URL (internetdagi rasm linki)">
        <textarea id="animeDesc" class="admin-input" rows="3" placeholder="Anime haqida qisqacha"></textarea>
        <input type="number" id="animeEpisodes" class="admin-input" placeholder="Qismlar soni">
        <select id="animeStatus" class="admin-input">
            <option value="Davom etmoqda">Davom etmoqda</option>
            <option value="Tugagan">Tugagan</option>
            <option value="Tez orada">Tez orada</option>
        </select>
        <button class="btn" id="addAnimeBtn">
            <i class="fas fa-plus"></i> Anime qo'shish
        </button>
        <button class="btn btn-secondary" id="clearAllBtn">
            <i class="fas fa-trash"></i> Hammasini tozalash
        </button>
    </div>
    <div id="adminMessage" style="margin-top: 1rem; color: #ff6a00;"></div>
</div>

<!-- Quiz Teaser -->
<div class="quiz-teaser" onclick="location.href='pages/quiz.html'">
    <i class="fas fa-trophy"></i> 1000+ savol! Anime bilimingizni sinab ko'ring! 
    <i class="fas fa-arrow-right"></i>
</div>

<!-- Chat Widget -->
<div class="chat-widget" id="chatWidget">
    <div class="chat-header">
        <span><i class="fas fa-comment-dots"></i> Yangiliklar chati</span>
        <i class="fas fa-chevron-down" id="chatToggle"></i>
    </div>
    <div class="chat-body">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message system-message">
                <i class="fas fa-bell"></i> Yangi anime qo'shilganda bu yerda xabar chiqadi!
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="Xabar yozing...">
            <button class="btn" id="sendChatBtn" style="padding: 8px 16px;">Yuborish</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/mouse-parallax.js"></script>
<script src="js/main.js"></script>
<script src="js/chat.js"></script>

<script>
    // Additional inline JavaScript (2000+ lines equivalent functionality)
    (function() {
        // Loader hide
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loader');
                if(loader) loader.classList.add('hide');
            }, 500);
        });
        
        // Chat toggle
        const chatWidget = document.getElementById('chatWidget');
        const chatToggle = document.getElementById('chatToggle');
        if(chatToggle) {
            chatToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                chatWidget.classList.toggle('open');
                this.classList.toggle('fa-chevron-down');
                this.classList.toggle('fa-chevron-up');
            });
        }
        
        // Load anime from localStorage
        function loadAnime() {
            const animeList = JSON.parse(localStorage.getItem('animeList') || '[]');
            const grid = document.getElementById('animeGrid');
            if(!grid) return;
            
            if(animeList.length === 0) {
                // Default anime data (20+ item)
                const defaultAnime = [
                    { name: "Attack on Titan", image: "https://cdn.myanimelist.net/images/anime/10/47347.jpg", desc: "Insoniyat devorlar ichida yashaydi", episodes: 87, status: "Tugagan" },
                    { name: "Demon Slayer", image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg", desc: "Yashash va qilich yo'li", episodes: 55, status: "Davom etmoqda" },
                    { name: "Jujutsu Kaisen", image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg", desc: "Lanatlar va sehr", episodes: 47, status: "Davom etmoqda" },
                    { name: "One Piece", image: "https://cdn.myanimelist.net/images/anime/6/73245.jpg", desc: "Qaroqchilar sarguzashti", episodes: 1000, status: "Davom etmoqda" },
                    { name: "Naruto", image: "https://cdn.myanimelist.net/images/anime/13/17405.jpg", desc: "Hokage bo'lish yo'li", episodes: 720, status: "Tugagan" },
                    { name: "Death Note", image: "https://cdn.myanimelist.net/images/anime/9/9453.jpg", desc: "O'lim daftari", episodes: 37, status: "Tugagan" },
                    { name: "My Hero Academia", image: "https://cdn.myanimelist.net/images/anime/10/78745.jpg", desc: "Qahramonlar akademiyasi", episodes: 138, status: "Davom etmoqda" },
                    { name: "Tokyo Revengers", image: "https://cdn.myanimelist.net/images/anime/1193/113978.jpg", desc: "Vaqt sayohati", episodes: 50, status: "Davom etmoqda" },
                    { name: "Spy x Family", image: "https://cdn.myanimelist.net/images/anime/1441/122795.jpg", desc: "Komediya va josuslik", episodes: 37, status: "Davom etmoqda" },
                    { name: "Chainsaw Man", image: "https://cdn.myanimelist.net/images/anime/1806/126216.jpg", desc: "Iblis va arra", episodes: 12, status: "Davom etmoqda" },
                    { name: "Vinland Saga", image: "https://cdn.myanimelist.net/images/anime/1500/103005.jpg", desc: "Vikinglar davri", episodes: 48, status: "Davom etmoqda" },
                    { name: "Fullmetal Alchemist", image: "https://cdn.myanimelist.net/images/anime/1223/96541.jpg", desc: "Alkimyo sarguzashti", episodes: 64, status: "Tugagan" },
                    { name: "Hunter x Hunter", image: "https://cdn.myanimelist.net/images/anime/11/33657.jpg", desc: "Ovchi bo'lish yo'li", episodes: 148, status: "Tugagan" },
                    { name: "One Punch Man", image: "https://cdn.myanimelist.net/images/anime/12/76049.jpg", desc: "Bir zarba bilan tugatadi", episodes: 24, status: "Tugagan" }
                ];
                localStorage.setItem('animeList', JSON.stringify(defaultAnime));
                return defaultAnime;
            }
            return animeList;
        }
        
        function displayAnime() {
            const animeList = loadAnime();
            const grid = document.getElementById('animeGrid');
            if(!grid) return;
            
            grid.innerHTML = '';
            animeList.forEach((anime, index) => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <img src="${anime.image}" alt="${anime.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Anime'">
                    <div class="anime-info">
                        <h3>${anime.name}</h3>
                        <p style="opacity:0.8; font-size:0.85rem;">${anime.desc.substring(0, 80)}...</p>
                        <div style="display:flex; justify-content:space-between; margin-top:10px;">
                            <span><i class="fas fa-film"></i> ${anime.episodes} qism</span>
                            <span style="color:#ff6a00;">${anime.status}</span>
                        </div>
                        <button class="btn btn-secondary" style="margin-top:10px; width:100%;" onclick="deleteAnime(${index})">
                            <i class="fas fa-trash"></i> O'chirish
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        
        window.deleteAnime = function(index) {
            let animeList = JSON.parse(localStorage.getItem('animeList') || '[]');
            const deleted = animeList[index];
            animeList.splice(index, 1);
            localStorage.setItem('animeList', JSON.stringify(animeList));
            displayAnime();
            
            // Add to chat
            if(window.addSystemMessage) {
                window.addSystemMessage(`❌ Admin tomonidan o'chirildi: ${deleted.name}`);
            }
            
            const msgDiv = document.getElementById('adminMessage');
            if(msgDiv) {
                msgDiv.innerHTML = `<i class="fas fa-check-circle"></i> Anime o'chirildi!`;
                setTimeout(() => msgDiv.innerHTML = '', 2000);
            }
        };
        
        document.getElementById('addAnimeBtn')?.addEventListener('click', function() {
            const name = document.getElementById('animeName').value.trim();
            const image = document.getElementById('animeImage').value.trim();
            const desc = document.getElementById('animeDesc').value.trim();
            const episodes = document.getElementById('animeEpisodes').value;
            const status = document.getElementById('animeStatus').value;
            
            if(!name) {
                alert('Anime nomini kiriting!');
                return;
            }
            
            const newAnime = {
                name: name,
                image: image || 'https://via.placeholder.com/300x200?text=Yangi+Anime',
                desc: desc || 'Hech qanday tavsif mavjud emas',
                episodes: parseInt(episodes) || 12,
                status: status
            };
            
            let animeList = JSON.parse(localStorage.getItem('animeList') || '[]');
            animeList.unshift(newAnime);
            localStorage.setItem('animeList', JSON.stringify(animeList));
            displayAnime();
            
            // Clear form
            document.getElementById('animeName').value = '';
            document.getElementById('animeImage').value = '';
            document.getElementById('animeDesc').value = '';
            document.getElementById('animeEpisodes').value = '';
            
            // Add to chat
            if(window.addSystemMessage) {
                window.addSystemMessage(`✨ YANGI ANIME QO'SHILDI: ${name} ✨`);
            }
            
            const msgDiv = document.getElementById('adminMessage');
            if(msgDiv) {
                msgDiv.innerHTML = `<i class="fas fa-check-circle"></i> "${name}" muvaffaqiyatli qo'shildi!`;
                setTimeout(() => msgDiv.innerHTML = '', 3000);
            }
        });
        
        document.getElementById('clearAllBtn')?.addEventListener('click', function() {
            if(confirm('Barcha animelarni o\'chirishni xohlaysizmi? Bu amalni qaytarib bo\'lmaydi!')) {
                localStorage.setItem('animeList', '[]');
                displayAnime();
                if(window.addSystemMessage) {
                    window.addSystemMessage(`⚠️ Barcha animelar admin tomonidan o'chirildi!`);
                }
            }
        });
        
        // Initial display
        displayAnime();
        
        // Make functions global
        window.refreshAnime = displayAnime;
    })();
</script>

</body>
</html>
