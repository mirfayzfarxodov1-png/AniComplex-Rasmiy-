<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ro'yxatdan o'tish | AniComplex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .register-container {
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s;
        }
        
        .register-card {
            background: rgba(15, 15, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .logo i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logo h1 {
            font-size: 1.5rem;
            margin-top: 0.3rem;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #ee0979;
            box-shadow: 0 0 12px rgba(238,9,121,0.3);
        }
        
        .form-control.error {
            border-color: #f44336;
        }
        
        .error-text {
            color: #f44336;
            font-size: 0.75rem;
            margin-top: 0.3rem;
            display: none;
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }
        
        .strength-text {
            font-size: 0.7rem;
            margin-top: 0.3rem;
            color: rgba(255,255,255,0.5);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.2rem 0;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
        
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(238,9,121,0.4);
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
        
        .login-link a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: 600;
        }
        
        .social-register {
            margin-top: 1.5rem;
            text-align: center;
        }
        
        .social-register p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .social-register p::before,
        .social-register p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        
        .social-register p::before { left: 0; }
        .social-register p::after { right: 0; }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .social-icon {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }
        
        .social-icon:hover {
            background: rgba(238,9,121,0.2);
            transform: translateY(-3px);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .register-card {
                padding: 1.5rem;
            }
        }
        
        .alert {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
        }
        
        .alert-error {
            background: rgba(244,67,54,0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        
        .alert-success {
            background: rgba(76,175,80,0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        
        .terms-link {
            color: #ff6a00;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <i class="fas fa-dragon"></i>
                <h1>AniComplex</h1>
                <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">Yangi akkaunt yaratish</p>
            </div>
            
            <div id="alert" class="alert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> To'liq ism</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullname" class="form-control" placeholder="Ismingiz familiyangiz" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                    </div>
                    <div class="error-text" id="emailError">Noto'g'ri email formati</div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="text" id="username" class="form-control" placeholder="kullanici_adi" required>
                    </div>
                    <div class="error-text" id="usernameError">Username 3-20 belgi oralig'ida bo'lishi kerak</div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Parol</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Parol kuchliligi: zaif</div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Parolni tasdiqlang</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle"></i>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms"> 
                        Men <a href="#" class="terms-link">foydalanish shartlari</a> va <a href="#" class="terms-link">maxfiylik siyosatiga</a> roziman
                    </label>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-user-plus"></i> Ro'yxatdan o'tish
                </button>
            </form>
            
            <div class="social-register">
                <p>yoki</p>
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-apple"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
            
            <div class="login-link">
                Akkauntingiz bormi? <a href="login.html">Kirish</a>
            </div>
        </div>
    </div>
    
    <script>
        // Password strength checker
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const strengths = ['Juda zaif', 'Zaif', 'O\'rta', 'Kuchli', 'Juda kuchli'];
            const colors = ['#f44336', '#ff9800', '#ffc107', '#4caf50', '#2196f3'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            
            strengthBar.style.width = widths[strength] || '20%';
            strengthBar.style.background = colors[strength] || '#f44336';
            strengthText.textContent = `Parol kuchliligi: ${strengths[strength] || 'Zaif'}`;
            strengthText.style.color = colors[strength] || '#f44336';
            
            return strength >= 3;
        }
        
        passwordInput.addEventListener('input', () => {
            checkPasswordStrength(passwordInput.value);
        });
        
        // Form validation
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        
        function validateUsername(username) {
            return /^[a-zA-Z0-9_]{3,20}$/.test(username);
        }
        
        document.getElementById('email').addEventListener('input', (e) => {
            const emailError = document.getElementById('emailError');
            if (!validateEmail(e.target.value)) {
                emailError.style.display = 'block';
                e.target.classList.add('error');
            } else {
                emailError.style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        document.getElementById('username').addEventListener('input', (e) => {
            const usernameError = document.getElementById('usernameError');
            if (!validateUsername(e.target.value)) {
                usernameError.style.display = 'block';
                e.target.classList.add('error');
            } else {
                usernameError.style.display = 'none';
                e.target.classList.remove('error');
            }
        });
        
        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }
        
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            // Validations
            if (!fullname) {
                showAlert('To\'liq ismni kiriting!');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('Noto\'g\'ri email formati!');
                return;
            }
            
            if (!validateUsername(username)) {
                showAlert('Username 3-20 belgi oralig\'ida bo\'lishi kerak!');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Parol kamida 6 belgidan iborat bo\'lishi kerak!');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('Parollar mos kelmadi!');
                return;
            }
            
            if (!terms) {
                showAlert('Foydalanish shartlariga rozilik bildiring!');
                return;
            }
            
            // Save user
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.find(u => u.email === email)) {
                showAlert('Bu email allaqachon ro\'yxatdan o\'tgan!');
                return;
            }
            
            if (users.find(u => u.username === username)) {
                showAlert('Bu username allaqachon olingan!');
                return;
            }
            
            users.push({
                id: Date.now(),
                fullname: fullname,
                email: email,
                username: username,
                password: password,
                joinDate: new Date().toISOString(),
                avatar: 'default.png'
            });
            
            localStorage.setItem('users', JSON.stringify(users));
            showAlert('Ro\'yxatdan o\'tish muvaffaqiyatli! Kirish sahifasiga o\'tilyapti...', 'success');
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
        
        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
