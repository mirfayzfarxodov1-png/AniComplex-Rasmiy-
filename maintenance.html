<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texnik ishlar | AniComplex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .maintenance-container {
            text-align: center;
            max-width: 600px;
            animation: fadeInUp 0.6s;
        }
        
        .maintenance-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: rotate 3s linear infinite;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .progress-bar {
            width: 65%;
            height: 100%;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            border-radius: 10px;
            animation: progressPulse 2s ease-in-out infinite;
        }
        
        .status-text {
            color: #ff6a00;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .social-link {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .social-link:hover {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            transform: translateY(-3px);
        }
        
        .countdown {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6a00;
            margin-top: 1rem;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes progressPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .maintenance-icon { font-size: 3rem; }
        }
        
        .notification-input {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        
        .notification-input input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            color: #fff;
        }
        
        .notification-input button {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Texnik ishlar olib borilmoqda</h1>
        <p>
            Saytimizda texnik ishlar olib borilmoqda. Tez orada xizmat qayta tiklanadi.<br>
            Kutilmagan noqulayliklar uchun uzr so'raymiz.
        </p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="status-text">
            <i class="fas fa-sync-alt fa-spin"></i> Yangilanish jarayoni: 65%
        </div>
        
        <div class="countdown" id="countdown">
            Taxminiy vaqt: 00:00
        </div>
        
        <div class="notification-input">
            <input type="email" id="notifyEmail" placeholder="Email manzilingiz">
            <button onclick="notifyMe()">
                <i class="fas fa-bell"></i> Xabar berish
            </button>
        </div>
        
        <p style="font-size: 0.85rem; margin-top: 1rem;">
            Ish tugagach sizga xabar yuboramiz
        </p>
        
        <div class="social-links">
            <a href="#" class="social-link"><i class="fab fa-telegram"></i></a>
            <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-link"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
        </div>
    </div>
    
    <script>
        function notifyMe() {
            const email = document.getElementById('notifyEmail').value;
            if(email) {
                // Save to localStorage
                const emails = JSON.parse(localStorage.getItem('notify_emails') || '[]');
                if(!emails.includes(email)) {
                    emails.push(email);
                    localStorage.setItem('notify_emails', JSON.stringify(emails));
                }
                alert('Sizga xabar yuboramiz!');
                document.getElementById('notifyEmail').value = '';
            } else {
                alert('Iltimos, email manzilingizni kiriting!');
            }
        }
        
        // Countdown timer (simulated)
        let minutes = 15;
        let seconds = 0;
        
        function updateCountdown() {
            const countdownEl = document.getElementById('countdown');
            if(minutes === 0 && seconds === 0) {
                countdownEl.innerHTML = 'Tez orada!';
                return;
            }
            
            if(seconds === 0) {
                minutes--;
                seconds = 59;
            } else {
                seconds--;
            }
            
            countdownEl.innerHTML = `Taxminiy vaqt: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
