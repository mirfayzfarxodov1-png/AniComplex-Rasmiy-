# ============================================================================
# AniComplex - Netlify Configuration
# Version: 3.0.0
# ============================================================================

[build]
  publish = "."
  command = "echo 'Build complete'"

# ============================================================================
# Redirects
# ============================================================================

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/anime"
  to = "/api/anime.json"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/api/users.json"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/api/comments.json"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/api/settings.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ============================================================================
# Headers
# ============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# ============================================================================
# Rewrites for SPA
# ============================================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Role = "!admin"}

# ============================================================================
# Functions
# ============================================================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ============================================================================
# Build settings
# ============================================================================

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# ============================================================================
# Forms
# ============================================================================

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ============================================================================
# Image optimization
# ============================================================================

[build.processing.images]
  compress = true
  quality = 80

# ============================================================================
# Split testing
# ============================================================================

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "preview" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }
