# ============================================================================
# AniComplex - Nginx Configuration
# Version: 3.0.0
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name anicomplex.uz www.anicomplex.uz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anicomplex.uz www.anicomplex.uz;
    root /var/www/anicomplex;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/ssl/anicomplex.crt;
    ssl_certificate_key /etc/ssl/anicomplex.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*; connect-src 'self'; frame-src 'self' https://www.youtube.com;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Cache Control
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API routes
    location /api/anime {
        alias /var/www/anicomplex/api/anime.json;
        add_header Content-Type application/json;
    }

    location /api/anime/ {
        alias /var/www/anicomplex/api/anime.json;
        add_header Content-Type application/json;
    }

    # PWA files
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Sitemap
    location = /sitemap.xml {
        add_header Cache-Control "max-age=3600";
    }

    # Robots
    location = /robots.txt {
        add_header Cache-Control "max-age=3600";
    }

    # Block bad bots
    if ($http_user_agent ~* (ahrefs|majestic|rogerbot|semrush)) {
        return 403;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 /500.html;

    # Default location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Protect files
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/anicomplex_access.log;
    error_log /var/log/nginx/anicomplex_error.log;
}
